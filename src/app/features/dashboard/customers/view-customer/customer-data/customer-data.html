<div class="grid grid-cols-2 gap-2">
  <div class="col-span-1">
    <span class="text-xs text-gray-400">Name:</span>
    <p>{{ customerData().name }}</p>
  </div>
  <div class="col-span-1">
    <span class="text-xs text-gray-400">Email:</span>
    <p>{{ customerData().email }}</p>
  </div>
  <div class="col-span-1">
    <span class="text-xs text-gray-400">Phone:</span>
    <p>{{ customerData().phone }}</p>
  </div>
  <div class="col-span-1">
    <span class="text-xs text-gray-400">National ID:</span>
    <p>{{ customerData().nationalId }}</p>
  </div>
  <div class="col-span-1">
    <span class="text-xs text-gray-400">Segment:</span>
    <p>{{ customerData().segment }}</p>
  </div>
</div>
