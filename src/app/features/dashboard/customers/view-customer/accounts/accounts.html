<div class="flex flex-col gap-10 items-start justify-start">
  <p-table [value]="accounts()" class="w-full" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template #header>
      <tr>
        <th>Id</th>
        <th>Customer Id</th>
        <th>Type</th>
        <th>Currency</th>
        <th>Balance</th>
        <th>Iban</th>
        <th>Status</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-account>
      <tr>
        @if (loading()) {
          <td><p-skeleton width="5rem" height="1rem" borderRadius="16px" /></td>
          <td><p-skeleton width="5rem" height="1rem" borderRadius="16px" /></td>
          <td><p-skeleton width="3rem" height="0.6rem" borderRadius="4px" /></td>
          <td><p-skeleton width="6rem" height="1rem" borderRadius="16px" /></td>
          <td><p-skeleton width="3rem" height="0.6rem" borderRadius="4px" /></td>
          <td><p-skeleton width="6rem" height="1rem" borderRadius="16px" /></td>
          <td><p-skeleton width="6rem" height="1rem" borderRadius="16px" /></td>
          <td><p-skeleton width="6rem" height="1rem" borderRadius="16px" /></td>
        } @else {
          <td>{{ account.id }}</td>
          <td>{{ account.customerId }}</td>
          <td>{{ account.type }}</td>
          <td>{{ account.currency }}</td>
          <td>{{ account.balance }}</td>
          <td>{{ account.iban }}</td>
          <td>{{ account.status }}</td>
          <td>
            <button
              type="button"
              pButton
              iconOnly
              [disabled]="loadingAccountTransaction()"
              (click)="loadTransactionData(account.id)"
              severity="secondary"
              rounded
              class="cursor-pointer"
            >
              @if (loadingAccountTransaction()) {
                <svg data-p-icon="spinner" class="animate-spin"></svg>
              } @else {
                <svg data-p-icon="eye"></svg>
              }
            </button>
          </td>
        }
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7">
          <div class="flex flex-col items-center justify-center gap-3 py-16 text-center">
            <div
              class="w-14 h-14 rounded-full bg-surface-100 dark:bg-surface-800 flex items-center justify-center"
            >
              <svg
                data-p-icon="database"
                [size]="64"
                class="text-xl text-surface-400 dark:text-surface-500"
              />
            </div>
            <div>
              <p class="m-0 font-semibold text-surface-900 dark:text-surface-0">
                No Accounts found
              </p>
              <p class="mt-1 text-sm text-surface-500 dark:text-surface-400">
                Try adjusting your search or filters.
              </p>
            </div>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <app-transactions class="w-full" [accountId]="selectedAccount()"></app-transactions>
</div>
