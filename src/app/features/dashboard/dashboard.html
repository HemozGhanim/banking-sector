<div class="rounded-lg overflow-hidden">
  <p-sidebar-layout class="max-h-screen! relative!">
    <p-sidebar
      id="variants-demo"
      [variant]="variant"
      [collapsible]="collapsible"
      [side]="side"
      [overlay]="overlay"
      [openOnHover]="openOnHover"
    >
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-header>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="px-1!">
                  <div
                    class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-xs font-bold leading-none"
                  >
                    B
                  </div>
                  <span class="font-semibold text-sm">Banking Sector</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>
          <p-sidebar-content>
            @for (group of navGroups; track group.label) {
              <p-sidebar-group>
                <p-sidebar-group-label>{{ group.label }}</p-sidebar-group-label>
                <p-sidebar-group-content>
                  <p-sidebar-menu>
                    @for (item of group.items; track item.label) {
                      <p-sidebar-menu-item
                        [collapsible]="!!item.subItems"
                        [defaultOpen]="hasActiveSub(item)"
                      >
                        <button
                          pSidebarMenuButton
                          [isActive]="!!item.isActive"
                          [routerLink]="item.route"
                        >
                          <svg [pIcon]="item.icon"></svg>
                          <span>{{ item.label }}</span>
                          @if (item.subItems) {
                            <svg data-p-icon="chevron-down" class="ml-auto"></svg>
                          }
                        </button>
                        @if (item.badge) {
                          <p-sidebar-menu-badge>{{ item.badge }}</p-sidebar-menu-badge>
                        }
                        @if (item.subItems) {
                          <p-sidebar-menu-sub>
                            @for (sub of item.subItems; track sub.label) {
                              <p-sidebar-menu-sub-item>
                                <button pSidebarMenuSubButton [isActive]="!!sub.isActive">
                                  <span>{{ sub.label }}</span>
                                </button>
                              </p-sidebar-menu-sub-item>
                            }
                          </p-sidebar-menu-sub>
                        } @else if (!item.badge) {
                          <button pSidebarMenuAction showOnHover>
                            <svg data-p-icon="ellipsis-v"></svg>
                          </button>
                        }
                      </p-sidebar-menu-item>
                    }
                  </p-sidebar-menu>
                </p-sidebar-group-content>
              </p-sidebar-group>
            }
          </p-sidebar-content>
          <p-sidebar-footer>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1!">
                  <p-avatar
                    label="{{ firstLetter() }}"
                    shape="circle"
                    class="size-6 shrink-0 text-xs"
                  />
                  <span>{{ userEmail() }}</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-footer>
          <button pSidebarRail></button>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>
    @if (side === 'left') {
      <p-sidebar-main>
        <header
          class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-gray-700 px-4"
        >
          <button
            pButton
            pSidebarTrigger
            target="variants-demo"
            severity="secondary"
            text
            size="small"
          >
            <svg data-p-icon="sidebar"></svg>
          </button>
        </header>
        <div class="flex-1 p-4 flex flex-col gap-4">
          <router-outlet></router-outlet>
        </div>
      </p-sidebar-main>
    }
  </p-sidebar-layout>
</div>
